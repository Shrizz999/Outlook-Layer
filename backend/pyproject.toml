[project]
name = "balbird-intelligence-backend"
version = "0.1.0"
description = "Balbird Intelligence Backend API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "supabase>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",           # OpenAI SDK with OpenRouter base URL
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",
    "apscheduler>=3.10.0",      # Background job scheduling
    "structlog>=24.4.0",        # Structured logging
    "email-validator>=2.2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "msal>=1.39.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.27.0",
    "coverage>=7.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
